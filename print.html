<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impression — Aero Services</title>
<link rel="stylesheet" href="css/print.css?v=20261121b">
<link rel="stylesheet" href="css/workorder.css?v=20261121b">
<style>
*{box-sizing:border-box;margin:0;padding:0}
@media screen{
  body{margin:0;background:#111214;color:#e8eaed;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
  .tb{padding:24px}.tb p{margin:0 0 18px;color:#9aa0a6}
  .tb button{font:600 16px system-ui;border:0;border-radius:999px;padding:14px 26px;margin:6px;background:#34a853;color:#fff}
  .tb button.s{background:#2a2b31;color:#e8eaed}
}
@media print{.tb{display:none!important}}
</style></head>
<body>
<div class="tb" id="tb" style="display:none"><p id="msg"></p>
<button onclick="window.print()">🖨 Imprimer / PDF</button>
<button class="s" onclick="window.close();history.length>1&&history.back()">Fermer</button></div>
<div id="sheet"></div><div id="sheetOps"></div><div id="sheetWO"></div>
<script>
(function(){
  var d=null;try{d=JSON.parse(localStorage.getItem('print_payload')||'null');}catch(e){}
  var tb=document.getElementById('tb'),msg=document.getElementById('msg');
  function show(t){msg.textContent=t;tb.style.display='block';}
  if(!d||!document.getElementById(d.id)){show('Aucune feuille à imprimer. Reviens sur l\u2019application et relance la génération.');return;}
  var el=document.getElementById(d.id);
  el.innerHTML=d.html;if(d.cls)el.classList.add(d.cls);
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  // ordinateur : l'onglet se referme tout seul après l'impression
  if(!ios)window.onafterprint=function(){setTimeout(function(){window.close();},300);};
  setTimeout(function(){try{window.print();}catch(e){}},300);
  // secours si la fenêtre d'impression n'apparaît pas
  setTimeout(function(){show('Touche « Imprimer / PDF » pour ouvrir l\u2019impression.');},3500);
})();
</script></body></html>
